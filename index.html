<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Membership FAQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
              <h1 class="h3 mb-4 fw-bold">Membership FAQ</h1>
              <form id="faqForm" novalidate>
                <div class="mb-3">
                  <label for="questionInput" class="form-label fw-semibold">Ask a question</label>
                  <input id="questionInput" class="form-control form-control-lg" type="text" placeholder="What are the club's membership fees?" aria-describedby="questionError" />
                  <div id="questionError" class="invalid-feedback" aria-live="polite"></div>
                </div>
                <button id="submitBtn" class="btn btn-primary btn-lg" type="submit">Ask</button>
              </form>

              <section class="mt-4" aria-live="polite">
                <h2 class="h5 fw-bold">Answer</h2>
                <div id="answerBox" class="answer-box empty">Ask a question to see the answer.</div>
              </section>
              <section class="mt-4">
                <h2 class="h5 fw-bold">Source snippet</h2>
                <blockquote id="sourceBox" class="source-box empty mb-0">The exact FAQ text will appear here.</blockquote>
              </section>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
